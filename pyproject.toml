[project]
name = "map-distortion-project"
version = "1.0.0"
description = "Analytical pipeline and API for The Map Distortion Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "apps/api/tests"]
python_files = "test_*.py"
